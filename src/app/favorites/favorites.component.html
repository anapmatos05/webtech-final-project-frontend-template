<div class="favorites-container">
  <button routerLink="/" class="btn-back">
    <span class="arrow">←</span> Voltar à Página Inicial
  </button>

  <h1>Os Meus Favoritos</h1>
  <p class="subtitle">A tua coleção pessoal de filmes guardados.</p>

  <div *ngIf="favoriteMovies.length === 0" class="empty-state">
    <span class="empty-icon">🍿</span>
    <h2>A tua lista está vazia!</h2>
    <p>Volta à página inicial e clica nos corações para guardares filmes aqui.</p>
    <button routerLink="/" class="btn-primary">Explorar Filmes</button>
  </div>

  <div *ngIf="favoriteMovies.length > 0" class="movies-grid">
    <div class="movie-card" *ngFor="let movie of favoriteMovies" [routerLink]="['/movie', movie.movieId]">

      <img *ngIf="movie.moviePoster" [src]="imageBaseUrl + movie.moviePoster" [alt]="movie.movieTitle">

      <div class="movie-info">
        <h3>{{ movie.movieTitle }}</h3>

        <button class="btn-remove" (click)="removeFromFavorites(movie, $event)">
          ❌ Remover
        </button>
      </div>

    </div>
  </div>
</div>
