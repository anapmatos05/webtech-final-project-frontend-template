<div class="watchlist-container">
    <h1>A Minha Watchlist</h1>

    <div *ngIf="watchlistMovies.length === 0">
        <p>Ainda não adicionaste nenhum filme à watchlist.</p>
    </div>

    <div class="movies-grid">
        <div class="movie-card" *ngFor="let movie of watchlistMovies">
            <img [src]="imageBaseUrl + movie.poster_path" [alt]="movie.title" />
            <h3>{{ movie.title }}</h3>
            <button (click)="removeFromWatchlist(movie, $event)">Remover</button>
        </div>
    </div>
</div>
