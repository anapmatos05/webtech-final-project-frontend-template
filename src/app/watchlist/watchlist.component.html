<div class="favorites-container">
    <button routerLink="/" class="btn-back">
        <span class="arrow">←</span> Voltar à Página Inicial
    </button>

    <h1>A Minha Watchlist</h1>
    <p class="subtitle">Filmes que queres ver em breve.</p>

    <div *ngIf="watchlistMovies.length === 0" class="empty-state">
        <span class="empty-icon">🎬</span>
        <h2>A tua watchlist está vazia!</h2>
        <p>Volta à página inicial e clica em + Watchlist para guardares filmes aqui.</p>
        <button routerLink="/" class="btn-primary">Explorar Filmes</button>
    </div>

    <div *ngIf="watchlistMovies.length > 0" class="movies-grid">
        <div class="movie-card" *ngFor="let movie of watchlistMovies" [routerLink]="['/movie', movie.movieId]">
            <img *ngIf="movie.moviePoster" [src]="imageBaseUrl + movie.moviePoster" [alt]="movie.movieTitle">
            <div class="movie-info">
                <h3>{{ movie.movieTitle }}</h3>
                <button class="btn-remove" (click)="removeFromWatchlist(movie, $event)">
                    ❌ Remover
                </button>
            </div>
        </div>
    </div>
</div>
