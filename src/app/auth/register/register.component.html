<div class="register-container">
    <h2>Criar Conta</h2>

    <form (ngSubmit)="onSubmit()" #registerForm="ngForm">
        <div class="form-group">
            <label for="name">Nome Completo:</label>
            <input type="text" id="name" name="name" [(ngModel)]="user.name" required>
        </div>

        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" [(ngModel)]="user.email" required>
        </div>

        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" [(ngModel)]="user.password" required minlength="6">
        </div>

        <p *ngIf="errorMessage" class="error-msg">{{ errorMessage }}</p>

        <button type="submit" [disabled]="!registerForm.form.valid">Registar</button>
    </form>

    <p class="switch-auth">
        Já tens conta? <a routerLink="/login">Entra aqui</a>
    </p>
</div>
